<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <title>Simulateur Eden</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    </head>

    <body>
        <h1>Simulateur Eden</h1>

        <div id="navbar">
            <nav>
                <ul>
                    <li><button class="btn btn-outline-light btn_nav rounded-pill"><a href="qui-sommes-nous.html">Qui-sommes-nous ?</a></button></li>
                    <li><button class="btn btn-outline-light btn_nav rounded-pill"><a href="nos-collaborateurs.html">Nos collaborateurs</a></button></li>
                    <li><button class="btn btn-outline-light btn_nav rounded-pill"><a href="mon-compte.html">Mon compte</a></button></li>
                </ul>
            </nav>
        </div>
    
        <div id="conteneur">
        
            <!-- MENU -->
            <div id="menu">
        
                <h2>Options</h2>
        
                <h3>Forme du tapis</h3>
        
                <button onclick="formeTapis('carre')">Tapis carré</button>
                <button onclick="formeTapis('dressage')">Tapis dressage</button>
        
                <h3>Couleur</h3>
        
                <input type="color" id="picker" value="#ff0000" oninput="changerCouleur()">
        
            </div>
        
            <!-- ZONE CHEVAL -->
        
            <div id="scene">
        
                <!-- Tapis -->
        
                <div id="tapis">
        
                    <div id="couleur"></div>
        
                    <img id="tapis_carre" class="forme" src="images/tapis_carre.png">
        
                    <img id="tapis_dressage" class="forme" src="images/tapis_dressage.png">
        
                </div>
        
                <!-- Cheval -->
                <img src="cheval_test.svg" id="cheval" alt="Ceci est un cheval" height="100" width="200"/>
                <img src="crins_test.svg" id="crins" alt="Ceci est un crin de cheval" height="100" width="200"/>
        
            </div>
            
             <div id="bulle_contact">
                <h2 class="titre-bulle">Contact</h2>
                <div class="conteneur_colonnes">
                    <section id="contenu_bulle_gauche">
                        <h4>Mes coordonnées</h4>
                    </section>
                <section id="contenu_bulle_droite">
                    <h4>Mes réseaux sociaux</h4>
                    <div class="d-flex justify-content-center gap-4">
                        <a href="https://www.facebook.com/profile.php?id=100010935690727"><i class="bi bi-facebook" style="color: white; font-size: 2rem;"></i></a>
                        <a href="https://www.instagram.com/a.breath.of.eden/"><i class="bi bi-instagram" style="color: white; font-size: 2rem;"></i></a>
                    </div>
                </section>
            </div>
        
        </div>
    
        <script src="script.js"></script>
        <script>alert("BONJOUR CECI EST UN POPUP")</script>
    
    </body>

</html>
